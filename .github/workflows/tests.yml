name: Tests

on:
  push:
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-linux:
    name: pytest (ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 \
            libgl1 \
            libglib2.0-0 \
            libxkbcommon0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libfontconfig1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # requirements.txt pins Windows-only onnxruntime-directml; use the
          # CPU wheel on Linux (same swap requirements-mac.txt already makes).
          grep -v '^onnxruntime-directml$' requirements.txt > /tmp/requirements-ci.txt
          echo 'onnxruntime' >> /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt -r requirements-dev.txt

      - name: Run pytest
        run: pytest app/tests -q --tb=short
